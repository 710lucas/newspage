<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top right, rgb(33, 30, 76), rgb(4, 0, 20) 45%);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            font-family: Helvetica, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Div de Overlay para controlar o brilho/luminosidade do fundo */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: min(92vw, 960px);
            padding-top: 35vh;
            position: relative;
            z-index: 1; /* Garante que fica acima do overlay */
        }

        .main-time-container {
            display: flex;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
        }

        .main-search-container {
            background: rgba(255, 255, 255, 0.161);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 5rem;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .main-search-container form{
            width: 100%;
        }

        .main-search-container input {
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 2rem;
            min-width: 100%;
        }

        .main-feed-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 45vh;
            overflow-y: auto;
        }

        .feed-card {
            background: white;
            border-radius: 0.85rem;
            color: black;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            transition: 0.15s all;
            position: relative;
            max-height: fit-content;
        }

        .feed-card-text {
            display: flex;
            flex-direction: column;
            justify-content: end;
            gap: 0.25rem;
            padding: 1rem;
            overflow: hidden;
        }

        .feed-card-title {
            font-weight: 700;
            font-size: 1rem;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feed-card-name {
            font-size: 1rem;
            margin: 0;
            padding: 0.5rem 0.25rem;
            color: rgb(9, 9, 130);
        }

        .feed-card-date {
            font-size: 0.95rem;
            color: rgb(81, 81, 81);
        }

        .feed-card img {
            max-height: 10.5ch;
            min-width: 20ch;
            object-fit: cover;
            border-radius: 0 0.85rem 0.85rem 0;
            object-position: center;
        }

        .row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .icon-color {
            color: rgba(255, 255, 255, 0.75);
        }

        .medium-font {
            font-size: 1.5rem;
        }

        .gray {
            color: rgb(201, 201, 201);
        }

        .pointer {
            cursor: pointer;
        }

        .top-right {
            position: absolute;
            top: 0;
            right: 0;
            padding: 1rem;
            z-index: 2; /* Garante que fica interativo acima do overlay */
        }

        .hidden {
            display: none !important;
        }

        .modal {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(1px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Garante que fica acima de tudo */
        }

        .settings-panel {
            width: min(92vw, 760px);
            max-height: 85vh;
            overflow: auto;
            background: #ffffff;
            border: 1px solid #d9dce7;
            border-radius: 1rem;
            padding: 1.5rem;
            color: #161927;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .settings-title {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: 0.02em;
        }

        .settings-form-container {
            display: grid;
            gap: 1rem;
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            background: #f5f7fb;
            border: 1px solid #e4e8f2;
            border-radius: 0.8rem;
            padding: 0.9rem;
        }

        .settings-section h3 {
            margin: 0;
            font-size: 1rem;
            color: #121526;
        }

        .settings-section p {
            margin: 0;
            font-size: 0.9rem;
            color: #5f6580;
        }

        .settings-form-container input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border-radius: 0.5rem;
            border: 1px solid #cfd5e4;
            background: #ffffff;
            color: #111429;
            padding: 0.65rem 0.75rem;
            outline: none;
        }

        .settings-form-container input[type="text"]::placeholder {
            color: #9098b1;
        }

        .settings-form-container input[type="file"] {
            width: 100%;
            color: #404866;
        }

        /* Estilização personalizada para inputs de range (sliders) */
        .settings-form-container input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #cfd5e4;
            outline: none;
        }

        .settings-form-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #315fda;
            cursor: pointer;
            transition: background 0.15s;
        }

        .settings-form-container input[type="range"]::-webkit-slider-thumb:hover {
            background: #204cbd;
        }

        .settings-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 0.55rem;
            padding: 0.55rem 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #315fda;
            color: white;
        }

        .btn-neutral {
            background: #eceff6;
            color: #161927;
            border: 1px solid #d7ddea;
        }

        .btn-danger {
            background: transparent;
            color: #b3263c;
            border: 1px solid #b3263c;
        }

        .background-preview {
            width: 100%;
            height: 120px;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background-position: center;
            background-size: cover;
            background-image: radial-gradient(circle at top right, rgb(33, 30, 76), rgb(4, 0, 20) 45%);
        }

        .saved-feeds {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            max-height: 170px;
            overflow: auto;
            padding-right: 0.25rem;
        }

        .saved-feed-item {
            border: 1px solid #d8deea;
            border-radius: 0.55rem;
            padding: 0.5rem;
            background: #ffffff;
        }

        .saved-feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
        }

        .saved-feed-meta {
            margin: 0.3rem 0 0;
            color: #5f6580;
            font-size: 0.88rem;
            word-break: break-all;
        }

        .remove-feed-btn {
            font-size: 0.78rem;
            padding: 0.35rem 0.55rem;
        }

        .saved-pinned-item{
            object-fit: contain;
            display: flex;
            gap: 1rem;
        }

        .saved-pinned-item img{
            width: 2rem;
            height: 2rem;
        }

        .favicon-preview{
            width: 2rem;
            height: 2rem;
        }

        .main-pinned-container{
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        .pinned-item-card{
            width: 1.85rem;
            height: 1.85rem;
            display: flex;
            padding: 0.35rem;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem;
            backdrop-filter: blur(10px);
        }

        .saved-pins{
            display: flex;
            gap: 2rem;
            flex-direction: row;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <!-- Overlay Div para manipulação da luminosidade -->
    <div class="background-overlay" id="background-overlay"></div>

    <div class="top-right">
        <span class="material-symbols-outlined icon-color medium-font gray pointer" id="settings-button">settings</span>
    </div>
    
    <div class="main-container">
        <div class="main-time-container" id="time-container"></div>

        <div class="main-search-container">
            <span class="material-symbols-outlined icon-color medium-font">search</span>
            <form id="search-form">
                <input type="text" name="search" placeholder="Search" class="medium-font">
            </form>
        </div>

        <div class="main-pinned-container" id="main-pinned-container"></div>
        <div class="main-feed-container" id="feed-container"></div>
    </div>

    <div class="modal hidden" id="modal-container"></div>

    <script src="newtab.js"></script>
</body>
</html>
